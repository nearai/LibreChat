# NEAR AI confidential inference — example config.
# Copy to librechat.yaml. Required in .env:
#   NEAR_API_KEY=sk-...                                  NEAR AI Cloud API key
#   NEAR_AI_VERIFY_URL=https://<cloud-ui host>/verify    page the shields link to (optional)
#
# Any custom endpoint whose baseURL is cloud-api.near.ai goes through the NEAR AI
# inference SDK: the Gateway and model TEE are attested before each request,
# prompts are encrypted to the model TEE, and every reply's signature is checked
# and saved on the message (shown as a shield next to the reply).
version: 1.3.17
cache: true

endpoints:
  custom:
    - name: 'NEAR AI'
      apiKey: '${NEAR_API_KEY}'
      baseURL: 'https://cloud-api.near.ai/v1'
      models:
        default:
          - 'Qwen/Qwen3.6-35B-A3B-FP8'
          - 'z-ai/glm-5.3-flash'
        fetch: false
      titleConvo: true
      titleModel: 'Qwen/Qwen3.6-35B-A3B-FP8'
      modelDisplayLabel: 'NEAR AI'
